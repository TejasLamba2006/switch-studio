[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "switch-studio"
version = "0.1.0"
description = "Multi-room creative production and fact-checked publishing studio built on Switch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
switch-studio = "switch_studio.cli:main"
